<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शिकायत पंजी — रायगढ़ वनमंडल</title>
<style>
:root{--bg:#f2eee1;--card:#fffdf7;--alt:#f8f4e8;--forest:#1c4335;--forest2:#2e7d5b;--gold:#b8860b;--ink:#1c241d;--soft:#5c6b5f;--line:#ddd7c5;
  --ok:#2e7d5b;--pend:#a8492f;--tr:#8a6d1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px 'Nirmala UI','Noto Sans Devanagari','Segoe UI',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
header{background:linear-gradient(160deg,#10241b,var(--forest) 70%);color:#f4f1e6;border-radius:6px;padding:18px 22px}
header h1{margin:0;font-size:22px}
header .sub{font-size:12.5px;opacity:.85;margin-top:4px}
header .tools{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#f4f1e6;text-decoration:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e7c66a;margin-right:5px}.dot.live{background:#7dd3a0}.dot.err{background:#ef8b72}
h2{font-size:17px;color:var(--forest);margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--forest);color:#f2efe4;padding:8px;text-align:left;font-weight:600;position:sticky;top:0;z-index:2;vertical-align:bottom}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even){background:var(--alt)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:#eef3ec}
.st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{background:#e4f2ea;color:var(--ok)}.st.pend{background:#f8e3dc;color:var(--pend)}.st.tr{background:#f6ecd4;color:var(--tr)}.st.oth{background:#ecebe6;color:var(--soft)}
.notes{font-size:12.5px;color:var(--soft);margin:8px 2px 0;padding-left:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.tab.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.tab .c{font-size:11px;opacity:.75;margin-left:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar input,.bar select{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:4px;background:#fff}
.bar input{flex:1 1 240px}
.cnt{font-size:12px;color:var(--soft);align-self:center}
.msg{padding:14px;color:var(--soft)}
@media print{header .tools,.bar,.tabs{display:none}th{position:static}}
</style>
<!-- Scrolling: back-to-top, progress bar, section snap (same as other pages) -->
<style>
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
section,.card,header{scroll-snap-align:start;scroll-margin-top:0px}
#sProg{position:fixed;left:0;top:0;height:3px;width:0;background:#e0a526;z-index:10001;pointer-events:none}
#sTop{position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:0;background:#1f4e5f;color:#fff;font-size:20px;
 box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer;z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s}
#sTop.on{opacity:.9;pointer-events:auto}
@media print{#sTop,#sProg{display:none}}
</style>
<script>document.addEventListener("DOMContentLoaded",function(){var d=document.documentElement,p=document.createElement("div"),b=document.createElement("button");
p.id="sProg";b.id="sTop";b.textContent="↑";b.title="ऊपर जाएँ";b.setAttribute("aria-label","Back to top");document.body.append(p,b);
b.onclick=function(){scrollTo({top:0,behavior:"smooth"})};
function u(){var y=scrollY,m=d.scrollHeight-innerHeight;b.classList.toggle("on",y>400);p.style.width=(m>0?y/m*100:0)+"%"}
addEventListener("scroll",u,{passive:true});addEventListener("resize",u);u()});</script>
</head>
<body>
<div class="wrap">
<header>
  <h1>शिकायत पंजी — रायगढ़ वनमंडल</h1>
  <div class="sub">सभी स्रोतों से प्राप्त शिकायतें — गोशवारा एवं प्रकरणवार सूची &middot; <b>Data updated: 10 Oct 2026</b></div>
  <div class="tools">
    <span class="pill"><span class="dot" id="dot"></span><span id="src">Google Sheet से लोड हो रहा है…</span></span>
    <a class="pill" id="shl" target="_blank" rel="noopener">🔗 Google Sheet खोलें ↗</a>
  </div>
</header>

<section>
  <h2>गोशवारा — स्रोतवार प्राप्त / निराकृत / लंबित</h2>
  <div class="card"><div class="tw"><table id="gos"><tbody><tr><td class="msg">लोड हो रहा है…</td></tr></tbody></table></div>
    <ol class="notes" id="gosNotes"></ol></div>
</section>

<section>
  <h2>प्रकरणवार सूची</h2>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="खोजें — नाम, विषय, प्रकरण क्र.…">
    <select id="fs"><option value="">सभी स्थिति</option></select>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="card"><div class="tw"><table id="lst"><tbody><tr><td class="msg">लोड हो रहा है…</td></tr></tbody></table></div></div>
</section>
</div>

<script>
const SHEET_ID="1tViA41SOlns02wxeUOHPyThMMQ1quZN9eq_kSCqbohk";
const GOSWARA_GID="293133210";
/* one tab per complaint source: [label, gid] */
const LISTS=[["पी.जी.एन.","929104209"],["जनचौपाल","6414656"],["सी.पी.ग्राम्स","1400100139"],["शासन से प्राप्त","935952531"],
  ["सीधे प्राप्त","1282305526"],["लोक आयोग","564000304"],["आर्थिक अपराध (EOW)","719634304"],["ई-समाधान","2002787155"],["जेम (GeM)","233833200"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
$("shl").href="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit";

function parseCSV(t){const R=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];
  if(q){if(c=='"'&&n=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}
  else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"){r.push(f);R.push(r);r=[];f=""}else if(c!="\r")f+=c}
  if(f!==""||r.length){r.push(f);R.push(r)}return R}
const load=gid=>fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&_=${Date.now()}`)
  .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(parseCSV);

function statusOf(s){s=String(s||"").trim();
  if(/^निराकृत/.test(s))return["निराकृत","ok"];if(/^लंबित/.test(s))return["लंबित","pend"];
  if(/अंतरित|हंस्तातर|हस्तांतर/.test(s))return["अंतरित","tr"];return[s,"oth"]}

/* ---- Goswara: header row has groups of 3 (प्राप्त/निराकृत/लंबित) per source ---- */
function renderGoswara(R){
  const h=R[0].map(c=>c.trim()), v=R.find((r,i)=>i>1&&/^\d+$/.test((r[1]||"").trim()))||[];
  const rows=[];for(let i=1;i+2<h.length;i+=3){if(!h[i])continue;
    rows.push([h[i].trim().replace(/\s+प्राप्त$/,"").trim(),+v[i]||0,+v[i+1]||0,+v[i+2]||0])}
  const T=k=>rows.reduce((a,r)=>a+r[k],0);
  $("gos").innerHTML="<thead><tr><th>स्रोत</th><th class=n>प्राप्त</th><th class=n>निराकृत</th><th class=n>लंबित</th></tr></thead><tbody>"+
    rows.map(r=>`<tr><td>${esc(r[0])}</td><td class=n>${r[1]}</td><td class=n>${r[2]}</td><td class=n>${r[3]}</td></tr>`).join("")+
    `<tr class=tot><td>योग</td><td class=n>${T(1)}</td><td class=n>${T(2)}</td><td class=n>${T(3)}</td></tr></tbody>`;
  $("gosNotes").innerHTML=R.slice(3).map(r=>r.find(c=>c.trim().length>20)).filter(Boolean)
    .map(t=>"<li>"+esc(t.replace(/^\d+\.\s*/,""))+"</li>").join("");
}

/* ---- Lists ---- */
const DATA={};let cur=LISTS[0][1];
function clean(R){
  const hdr=R[0].map(c=>c.trim()); const keep=hdr.map((c,i)=>c?i:-1).filter(i=>i>=0);
  const si=keep.find(i=>/^निराकृत/.test(hdr[i]));
  const rows=R.slice(1).filter(r=>{const vals=keep.map(i=>(r[i]||"").trim()).filter(Boolean);
      if(!vals.length||!(r[keep[0]]||"").trim())return false;            // signature / blank rows
      return !vals.every(x=>/^\d{1,2}$/.test(x));})                       // column-number row
    .map(r=>keep.map(i=>{const x=(r[i]||"").trim();return x==="VIEW"?"":x}));
  return{head:keep.map(i=>hdr[i]),rows,si:keep.indexOf(si)};
}
function drawTabs(){$("tabs").innerHTML=LISTS.map(([l,g])=>`<button class="tab${g===cur?" on":""}" data-g="${g}">${esc(l)}<span class=c>${DATA[g]?DATA[g].rows.length:"…"}</span></button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.g;$("q").value="";$("fs").value="";drawTabs();fillStatus();drawList()})}
function fillStatus(){const d=DATA[cur];const opts=d&&d.si>=0?[...new Set(d.rows.map(r=>statusOf(r[d.si])[0]).filter(Boolean))]:[];
  $("fs").innerHTML='<option value="">सभी स्थिति</option>'+opts.map(o=>`<option>${esc(o)}</option>`).join("")}
function drawList(){const d=DATA[cur];if(!d){$("lst").innerHTML='<tbody><tr><td class=msg>लोड हो रहा है…</td></tr></tbody>';return}
  const q=$("q").value.trim().toLowerCase(),fsv=$("fs").value;
  const rows=d.rows.filter(r=>(!q||r.join(" ").toLowerCase().includes(q))&&(!fsv||statusOf(r[d.si])[0]===fsv));
  $("cnt").textContent=`${rows.length} / ${d.rows.length} प्रकरण`;
  $("lst").innerHTML="<thead><tr>"+d.head.map(h=>`<th>${esc(h)}</th>`).join("")+"</tr></thead><tbody>"+
    (rows.length?rows.map(r=>"<tr>"+r.map((c,i)=>{if(i===d.si&&c){const[s,k]=statusOf(c);return`<td><span class="st ${k}" title="${esc(c)}">${esc(s.length>40?s.slice(0,40)+"…":s)}</span></td>`}
      return`<td>${esc(c)}</td>`}).join("")+"</tr>").join(""):'<tr><td class=msg colspan=20>कोई प्रकरण नहीं</td></tr>')+"</tbody>";
}
$("q").oninput=drawList;$("fs").onchange=drawList;

drawTabs();
Promise.all([load(GOSWARA_GID).then(renderGoswara),
  ...LISTS.map(([l,g])=>load(g).then(R=>{DATA[g]=clean(R);drawTabs();if(g===cur){fillStatus();drawList()}}))])
 .then(()=>{$("dot").className="dot live";$("src").textContent="Live · Google Sheet"})
 .catch(e=>{$("dot").className="dot err";$("src").textContent="Sheet नहीं पढ़ी जा सकी ("+e.message+")";});
</script>
</body>
</html>
